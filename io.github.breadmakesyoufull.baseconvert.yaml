id: io.github.breadmakesyoufull.baseconvert
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: baseconvert
rename-icon: icon
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: baseconvert
    buildsystem: simple
    build-commands:
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 flatpak/icon.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - pip3 install --prefix=/app --no-deps --no-build-isolation --no-compile '.[gui]'
    sources:
      - type: git
        url: https://github.com/BreadMakesYouFull/baseconvert.git
        tag: 2.1.1
        commit: 62b3ce633d839146fb021c613ae701b149ff7973
